<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendForge — Game Vault</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07070b;color:#f7f7fb;font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}
.wrap{width:min(1200px,94%);margin:auto}.top{padding:28px 0 10px;display:flex;justify-content:space-between;gap:20px;align-items:center}.logo{font-size:25px;font-weight:900}.logo b{color:#8b5cf6}.pill{padding:8px 12px;border:1px solid #292936;border-radius:99px;color:#aaa;background:#101018}
.hero{padding:45px 0 30px}.ey{color:#22d3ee;font-size:11px;font-weight:900;letter-spacing:2px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.95;margin:10px 0;background:linear-gradient(90deg,#fff,#8b5cf6,#22d3ee);-webkit-background-clip:text;color:transparent}.hero p{color:#9999a8;max-width:680px;font-size:17px}
.panel{background:#101017;border:1px solid #252532;border-radius:22px;padding:20px;margin:20px 0}.search{display:grid;grid-template-columns:1fr 150px 130px;gap:10px}.search input,.search select{background:#0a0a10;border:1px solid #30303d;color:white;padding:13px;border-radius:12px;outline:0}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid #2c2c39;background:#14141d;color:#aaa;padding:8px 11px;border-radius:99px;cursor:pointer}.chip.on,.chip:hover{color:white;border-color:#7755b7;background:#201638}
.stats{display:flex;gap:18px;color:#888;font-size:12px;margin-top:14px}.stats b{color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#111119;border:1px solid #292936;border-radius:18px;padding:15px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#5b4b82}.cover{height:115px;border-radius:13px;display:grid;place-items:center;font-size:45px;background:radial-gradient(circle at 30% 20%,#39245c,#13131e 55%,#0b2025)}.card h3{margin:12px 0 4px;font-size:18px}.desc{font-size:12px;color:#9696a5;min-height:37px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tags span{font-size:9px;color:#aaa;background:#1b1b25;padding:4px 6px;border-radius:5px}.play{width:100%;margin-top:12px;border:0;background:linear-gradient(90deg,#8b5cf6,#22d3ee);color:white;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}
.empty{padding:35px;text-align:center;color:#888}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:10;padding:30px}.modal.show{display:grid;place-items:center}.modalbox{width:min(700px,100%);background:#101017;border:1px solid #383849;border-radius:22px;padding:20px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.x{border:1px solid #333;background:#171720;color:white;border-radius:10px;padding:8px 12px;cursor:pointer}.gamearea{margin-top:15px;min-height:330px;background:#08080d;border:1px solid #242431;border-radius:16px;display:grid;place-items:center;padding:15px}
#snakeCanvas{max-width:100%;background:#050509;border:1px solid #272737}.bigbtn{border:0;background:#8b5cf6;color:white;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.score{color:#22d3ee;font-weight:800}
.tboard{display:grid;grid-template-columns:repeat(3,90px);gap:7px}.tcell{width:90px;height:90px;background:#171720;border:1px solid #333;color:white;font-size:35px;cursor:pointer;border-radius:10px}.reaction{width:min(430px,90%);height:180px;border:0;border-radius:18px;background:#30253f;color:white;font-size:24px;font-weight:900;cursor:pointer}.clicker{text-align:center}.clicker .coin{width:160px;height:160px;border-radius:50%;border:0;background:linear-gradient(145deg,#facc15,#f97316);font-size:55px;cursor:pointer;box-shadow:0 15px 40px #000}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}}@media(max-width:520px){.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}.tboard{grid-template-columns:repeat(3,72px)}.tcell{width:72px;height:72px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="logo">Trend<b>Forge</b> ⚡</div><div class="pill">🎮 GAME VAULT</div></header>
<section class="hero"><div class="ey">THE NEW FEATURE</div><h1>Don't find games.<br>Find your next obsession.</h1><p>A game-discovery vault with searchable games, smart recommendations, favorites, random picks and playable mini-games built directly into the site.</p></section>

<section class="panel">
<div class="search"><input id="q" placeholder="Search Minecraft, RPG, racing, horror, multiplayer..."><select id="genre"><option>All genres</option><option>Action</option><option>Adventure</option><option>RPG</option><option>Racing</option><option>Strategy</option><option>Sports</option><option>Indie</option><option>Party</option><option>Arcade</option></select><button class="bigbtn" id="random">🎲 Random</button></div>
<div class="chips"><button class="chip on" data-f="all">All</button><button class="chip" data-f="playable">Playable here</button><button class="chip" data-f="popular">Popular</button><button class="chip" data-f="multiplayer">Multiplayer</button><button class="chip" data-f="free">Free</button></div>
<div class="stats"><span><b id="shown">0</b> games shown</span><span><b>6</b> playable mini-games</span><span>⭐ Favorites: <b id="favCount">0</b></span></div>
</section>

<section class="grid" id="grid"></section>
</div>

<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><div><div class="ey" id="modalTag">PLAY NOW</div><h2 id="modalTitle">Game</h2></div><button class="x" id="close">✕</button></div><p id="modalDesc" style="color:#999"></p><div class="gamearea" id="gamearea"></div></div></div>

<script>
const games=[
["Minecraft","⛏️","Sandbox","Build, explore, craft and survive.","open world sandbox building multiplayer",false,true],
["Roblox","🧱","Adventure","Millions of player-created experiences.","multiplayer free social ugc",false,true],
["Fortnite","🪂","Action","Battle royale, creative worlds and fast action.","action multiplayer free competitive",false,true],
["Genshin Impact","⚔️","RPG","Anime open-world adventure with quests.","rpg open world story adventure",false,true],
["Rocket League","🚗","Sports","Rocket-powered football.","sports racing multiplayer competitive free",false,true],
["Forza Horizon 5","🏎️","Racing","Open-road racing and huge car collection.","racing open world cars",false,false],
["Elden Ring","👑","RPG","Epic fantasy action RPG and exploration.","rpg fantasy action open world",false,false],
["Stardew Valley","🌱","Indie","Cozy farming, exploration and friendships.","indie cozy farming story",false,false],
["Terraria","🗡️","Adventure","2D exploration, crafting and bosses.","adventure sandbox survival multiplayer",false,false],
["Among Us","🕵️","Party","Social deduction and teamwork.","party multiplayer social free",false,false],
["Hades","🔥","Action","Fast roguelike combat and story.","action indie roguelike",false,false],
["EA Sports FC","⚽","Sports","Football with clubs and competitive play.","sports football multiplayer",false,false],
["Valorant","🎯","Action","Tactical 5v5 competitive shooter.","action multiplayer competitive fps",false,false],
["Civilization VI","🏛️","Strategy","Build an empire across history.","strategy multiplayer turn based",false,false],
["Hollow Knight","🪲","Indie","Atmospheric exploration and challenging combat.","indie adventure metroidvania",false,false],
["Trackmania","🏁","Racing","Precision racing and time trials.","racing competitive free",false,false],
["Brawlhalla","🥊","Action","Platform fighting with a huge roster.","action multiplayer free",false,false],
["Geometry Dash","🔷","Arcade","Rhythm-based precision platforming.","arcade music action",false,false],
["Fall Guys","🍬","Party","Chaotic obstacle-course multiplayer.","party multiplayer free",false,false],
["Slay the Spire","🃏","Strategy","Deckbuilding roguelike strategy.","strategy indie roguelike",false,false],
["Celeste","🏔️","Indie","Precision platforming and a heartfelt story.","indie platformer story",false,false],
["Palworld","🐾","Adventure","Creature collecting, survival and building.","adventure survival open world multiplayer",false,false],
["Cuphead","☕","Action","Classic-style run-and-gun boss battles.","action indie boss",false,false],
["Tetris","🧩","Arcade","The timeless block-stacking challenge.","arcade puzzle classic free",true,true],
["Snake","🐍","Arcade","Classic snake — playable directly here.","arcade classic playable",true,true],
["Tic-Tac-Toe","⭕","Party","Classic three-in-a-row against the computer.","party classic playable",true,true],
["Reaction Test","⚡","Arcade","How fast can you react?","arcade reaction playable",true,true],
["Coin Clicker","🪙","Arcade","Tap the coin and chase a high score.","arcade clicker playable",true,true],
["Memory Match","🧠","Puzzle","Match the hidden pairs.","puzzle memory playable",true,true]
];
let filter="all",favorites=new Set(JSON.parse(localStorage.getItem("tfFav")||"[]"));
const grid=document.getElementById("grid");
function render(){let q=document.getElementById("q").value.toLowerCase(),g=document.getElementById("genre").value;
let arr=games.filter(x=>(filter==="all"||(filter==="playable"&&x[5])||(filter==="popular"&&x[6])||(filter==="multiplayer"&&x[4].includes("multiplayer"))||(filter==="free"&&x[4].includes("free")))&&(!q||x.slice(0,5).join(" ").toLowerCase().includes(q))&&(g==="All genres"||x[2]===g));
document.getElementById("shown").textContent=arr.length;document.getElementById("favCount").textContent=favorites.size;
grid.innerHTML=arr.length?arr.map((x,i)=>`<article class="card"><div class="cover">${x[1]}</div><h3>${x[0]}</h3><div class="desc">${x[3]}</div><div class="tags"><span>${x[2]}</span>${x[5]?'<span>PLAYABLE</span>':''}${x[4].includes("multiplayer")?'<span>MULTIPLAYER</span>':''}</div><button class="play" data-i="${games.indexOf(x)}">${x[5]?"▶ Play now":"🔎 Explore game"}</button><button class="chip fav" data-fav="${games.indexOf(x)}" style="margin-top:7px;width:100%"> ${favorites.has(games.indexOf(x))?"★ Saved":"☆ Save to favorites"}</button></article>`).join(""):"<div class='empty'>No matches. Try another search.</div>";
grid.querySelectorAll(".play").forEach(b=>b.onclick=()=>openGame(games[+b.dataset.i]));grid.querySelectorAll(".fav").forEach(b=>b.onclick=()=>{let i=+b.dataset.fav;favorites.has(i)?favorites.delete(i):favorites.add(i);localStorage.setItem("tfFav",JSON.stringify([...favorites]));render()})}
document.querySelectorAll(".chip").forEach(b=>{if(!b.dataset.f)b.dataset.f="";b.onclick=()=>{if(!["fav"].includes(b.className.split(" ")[1])){document.querySelectorAll(".chips .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");filter=b.dataset.f;render()}}});
document.getElementById("q").oninput=render;document.getElementById("genre").onchange=render;
document.getElementById("random").onclick=()=>openGame(games[Math.floor(Math.random()*games.length)]);
const modal=document.getElementById("modal"),area=document.getElementById("gamearea");
document.getElementById("close").onclick=()=>{modal.classList.remove("show");area.innerHTML=""};modal.onclick=e=>{if(e.target===modal)document.getElementById("close").click()};
function openGame(g){document.getElementById("modalTitle").textContent=g[0];document.getElementById("modalDesc").textContent=g[3];modal.classList.add("show");area.innerHTML=g[5]?"":`<div style="text-align:center"><div style="font-size:60px">${g[1]}</div><h3>${g[0]}</h3><p style="color:#888">Discovery card ready. Add an official store link or game API later.</p></div>`;if(g[0]==="Snake")snake();if(g[0]==="Tic-Tac-Toe")ttt();if(g[0]==="Reaction Test")reaction();if(g[0]==="Coin Clicker")clicker();if(g[0]==="Memory Match")memory();if(g[0]==="Tetris")tetris()}
function snake(){area.innerHTML='<div style="text-align:center"><div class="score">Score: <span id="ss">0</span></div><canvas id="snakeCanvas" width="320" height="320"></canvas><p style="color:#888">Use arrow keys.</p></div>';let c=document.getElementById("snakeCanvas"),x=c.getContext("2d"),s=16,pos=[160,160],dir=[1,0],food=[80,80],body=[[160,160]],score=0;function draw(){x.fillStyle="#050509";x.fillRect(0,0,320,320);x.fillStyle="#22d3ee";x.fillRect(food[0],food[1],s,s);x.fillStyle="#8b5cf6";body.forEach(p=>x.fillRect(p[0],p[1],s-1,s-1))}function tick(){pos=[pos[0]+dir[0]*s,pos[1]+dir[1]*s];if(pos[0]<0||pos[0]>=320||pos[1]<0||pos[1]>=320||body.some(p=>p[0]===pos[0]&&p[1]===pos[1])){score=0;body=[[160,160]];pos=[160,160];dir=[1,0];document.getElementById("ss").textContent=0;draw();return}body.unshift([...pos]);if(pos[0]===food[0]&&pos[1]===food[1]){score++;document.getElementById("ss").textContent=score;food=[Math.floor(Math.random()*20)*s,Math.floor(Math.random()*20)*s]}else body.pop();draw()}let key=e=>{if(e.key==="ArrowUp"&&dir[1]!==1)dir=[0,-1];if(e.key==="ArrowDown"&&dir[1]!==-1)dir=[0,1];if(e.key==="ArrowLeft"&&dir[0]!==1)dir=[-1,0];if(e.key==="ArrowRight"&&dir[0]!==-1)dir=[1,0]};document.addEventListener("keydown",key);let t=setInterval(tick,110);draw();modal.dataset.cleanup=()=>{clearInterval(t);document.removeEventListener("keydown",key)}}
function ttt(){area.innerHTML='<div><div class="tboard" id="tb"></div><p id="tm" class="score">Your turn</p></div>';let b=Array(9).fill(""),turn="X";function win(a){return[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(r=>r.every(i=>a[i]===turn))}function draw(){document.getElementById("tb").innerHTML=b.map((v,i)=>`<button class="tcell" data-i="${i}">${v}</button>`).join("");document.querySelectorAll(".tcell").forEach(c=>c.onclick=()=>{let i=+c.dataset.i;if(b[i])return;b[i]="X";if(win(b)||b.every(Boolean)){document.getElementById("tm").textContent=win(b)?"You win!":"Draw!";return}let choices=b.map((v,i)=>v?null:i).filter(x=>x!==null),j=choices[Math.floor(Math.random()*choices.length)];b[j]="O";document.getElementById("tm").textContent=win(b)?"Computer wins!":"Your turn";draw()})}draw()}
function reaction(){area.innerHTML='<button class="reaction" id="rb">WAIT...</button>';let b=document.getElementById("rb"),ready=false,start=0,timer=setTimeout(()=>{ready=true;b.textContent="CLICK!";b.style.background="#166534";start=performance.now()},1200+Math.random()*2800);b.onclick=()=>{if(!ready){clearTimeout(timer);b.textContent="Too early! Try again";return}b.textContent=Math.round(performance.now()-start)+" ms — again";ready=false;timer=setTimeout(()=>{ready=true;b.textContent="CLICK!";b.style.background="#166534";start=performance.now()},1200+Math.random()*2500)}}
function clicker(){area.innerHTML='<div class="clicker"><p class="score">Coins: <span id="co">0</span></p><button class="coin" id="coin">🪙</button><p style="color:#888">Click as fast as you can.</p></div>';let n=0;document.getElementById("coin").onclick=()=>document.getElementById("co").textContent=++n}
function memory(){let vals=["🍕","🚀","⚽","🎮","🍕","🚀","⚽","🎮"].sort(()=>Math.random()-.5),open=[],matched=0;area.innerHTML='<div style="display:grid;grid-template-columns:repeat(4,70px);gap:8px" id="mem"></div>';let m=document.getElementById("mem");vals.forEach((v,i)=>{let b=document.createElement("button");b.className="tcell";b.style.width="70px";b.style.height="70px";b.textContent="❓";b.onclick=()=>{if(open.length>=2||b.dataset.ok)return;b.textContent=v;open.push([i,b]);if(open.length===2){if(vals[open[0][0]]===vals[open[1][0]]){open.forEach(x=>x[1].dataset.ok=1);open=[];matched++;if(matched===4)setTimeout(()=>alert("You cleared the board!"),100)}else setTimeout(()=>{open.forEach(x=>x[1].textContent="❓");open=[]},550)}};m.appendChild(b)})}
function tetris(){area.innerHTML='<div style="text-align:center"><div style="font-size:55px">🧱</div><h3>Tetris mini</h3><p style="color:#888">A full keyboard Tetris engine can be added next; this vault already supports playable mini-games.</p><button class="bigbtn" onclick="document.getElementById(\\'close\\').click()">Back to vault</button></div>'}
render();
</script>
</body></html>
